<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>影片播放</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    video {
      width: 100%;
      max-width: 1200px;
      height: auto;
    }
  </style>
</head>

<body>
  <video controls playsinline>
    <source src="video.mp4" type="video/mp4">
    您的瀏覽器不支援影片播放。
  </video>
</body>
</html>
